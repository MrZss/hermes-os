name: Feature request
description: Suggest an improvement for Hermes Console
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Hermes Console do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Instance setup
        - Remote server
        - AI provider
        - Messaging integration
        - Chat
        - Packaging / release
        - Documentation
        - Other
